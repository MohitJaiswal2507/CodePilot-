[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codepilot-backend"
version = "0.1.0"
description = "CodePilot AI Serverless Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pypdf>=5.0.0",
    "google-genai>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pyjwt[crypto]>=2.9.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "api*"]
exclude = ["evals*", "alembic*", "chroma_data*", "tests*"]
namespaces = true

